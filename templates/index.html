<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Rap KBS</title>
    <style>
      body {
            background: #050505;
            color: white;
            font-family: Arial;
        }
        .neon-box {

            border: 1px solid #39ff14;
            box-shadow:
                0 0 10px #39ff14,
                0 0 20px #7d12ff;
        }
        .neon-button {

            background: #7d12ff;
            transition: 0.3s;
        }
        .neon-button:hover {

            box-shadow:
                0 0 10px #7d12ff,
                0 0 20px #39ff14;
        }
        .section {

            margin-top: 20px;
            padding: 15px;
            border: 1px solid #7d12ff;
            border-radius: 12px;
            background: #111111;
        }
        .rapper-card {

            border: 1px solid #39ff14;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            background: #0d0d0d;
        }
        .recommend-title {

            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #39ff14;
        }

    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-10">
<div class="w-full max-w-3xl">
    <div class="neon-box rounded-2xl p-8">
        <h1 class="text-5xl font-bold mb-4 text-center">
            RAP KBS
        </h1>
        <p class="text-center text-gray-400 mb-8">
            Enter artists or rap topics
        </p>
        <!-- FORM -->
        <form id="searchForm">
            <textarea
                id="userInput"
                placeholder="Example: I like Kendrick Lamar, politics and struggle rap..."
                class="w-full h-32 bg-black border border-purple-500 rounded-xl p-4 outline-none"
            ></textarea>
            <button
                type="submit"
                class="neon-button w-full mt-5 py-4 rounded-xl font-bold"
            >
                GET RECOMMENDATIONS
            </button>
        </form>
        <!-- RESULTS -->
        <div
            id="results"
            class="mt-8 space-y-4"
        ></div>
    </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
